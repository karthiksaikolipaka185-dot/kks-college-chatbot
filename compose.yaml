services:
  backend:
    build:
      context: ./server/server
      dockerfile: Dockerfile
    container_name: kks-chatbot-backend
    expose:
      - "5000"
    env_file:
      - ./server/server/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - kks-network

  frontend:
    build:
      context: ./client/KKS-platform
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: kks-chatbot-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kks-network

networks:
  kks-network:
    driver: bridge
